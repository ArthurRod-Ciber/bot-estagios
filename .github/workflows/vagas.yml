name: Buscar vagas de estágio

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora, no minuto 17 (UTC)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write           # para salvar data/seen.json

concurrency:
  group: vagas
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar e enviar
        run: python -m bot.main
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Salvar vagas já vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza vagas vistas"
          git pull --rebase -X theirs origin main
          git push
